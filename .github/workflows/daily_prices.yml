name: 每日競爭旅宿房價抓取

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 取出程式碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝套件
        run: pip install requests

      - name: 執行爬蟲
        run: python scrape_prices.py

      - name: 提交更新結果
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add prices.json
          git diff --staged --quiet || git commit -m "🏨 更新房價資料 $(date +'%Y-%m-%d %H:%M')"
          git pull --rebase
          git push
